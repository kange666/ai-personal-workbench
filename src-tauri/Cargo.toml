[package]
name = "ai-personal-workbench"
version = "1.9.9"
description = "星枢 ASTRION 本地桌面程序"
authors = ["Local User"]
edition = "2021"

[lib]
name = "ai_personal_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
chrono = { version = "0.4", features = ["serde"] }
fontdue = { version = "0.9.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# 显式设置 Windows 任务栏图标与应用身份；使用已有锁文件中的版本。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
